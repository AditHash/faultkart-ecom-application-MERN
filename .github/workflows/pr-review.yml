name: Pull request evidence gate
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
permissions:
  contents: read
jobs:
  pr-evidence:
    name: PR evidence check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate branch and PR evidence
        run: node scripts/verify-pr.mjs
