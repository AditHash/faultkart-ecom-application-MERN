# Full local development stack: MongoDB + Express API + React/Vite storefront.
# Unlike docker-compose.yml (MongoDB only), this file starts all three services.
services:
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - full-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev:server"]
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/faultkart
      PORT: "4000"
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev:client"]
    environment:
      VITE_HOST: 0.0.0.0
      VITE_API_PROXY_TARGET: http://api:4000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  full-mongo-data:
